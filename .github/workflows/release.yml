name: CI and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Keep the entire two-destination publication serialized for a given tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest

  release:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Preserve the existing PyPI Trusted Publisher match (repo/workflow/environment).
    # No static PyPI token. The GitHub Release job does not need this identity.
    environment:
      name: pypi
      url: https://pypi.org/p/qatlas-cli/
    permissions:
      contents: read
      id-token: write
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'
          python-version: '3.11'
      - run: uv sync --locked --extra dev --group build
      - name: Validate version and exact changelog section
        id: meta
        run: uv run --no-sync python scripts/release_metadata.py --tag "$GITHUB_REF_NAME"
      - name: Refuse to rebuild a version already recorded by PyPI
        run: uv run --no-sync python scripts/pypi_preflight.py
      # Hatchling and its dependencies come from the build group in uv.lock.
      - name: Build wheel and sdist once
        run: uv build --no-build-isolation --python .venv/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Publish the saved distributions to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        # No skip-existing: duplicate uploads require explicit recovery, not
        # another build. PyPI itself also rejects overwriting existing files.

  github-release:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'
          python-version: '3.11'
      - run: uv sync --locked --extra dev
      - name: Extract release notes from the same tag
        run: uv run --no-sync python scripts/release_metadata.py --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      # A failed GitHub-only job may be retried without rebuilding/reuploading PyPI.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: build/RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
          files: dist/*
          overwrite_files: false
          fail_on_unmatched_files: true
