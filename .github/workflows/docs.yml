name: Documentation

on:
  push:
    branches: [master]
    paths:
      - README.md
      - 'docs/**'
      - .github/workflows/docs.yml
  pull_request:
    branches: [master]
    paths:
      - README.md
      - 'docs/**'
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.30'
          python-version: '3.12'
          enable-cache: false
      - name: Build and verify documentation
        run: uv run --locked --script docs/build.py
      # Build and validate only: no hosting, upload, release or deployment.
